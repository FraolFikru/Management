# Builds the SEER Waiter as an Android app (APK) and publishes it as the
# "waiter-android" release, so it can be downloaded and installed on phones.
# The app carries its own screens, so it does not depend on the Vercel site;
# it talks to the SEER server at API_URL.
name: Waiter Android app

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "SEER server address the app talks to"
        default: "https://eirsha-api.onrender.com"
  push:
    branches: [main, waiter-android]
    paths: ["apps/waiter/**", ".github/workflows/waiter-android.yml"]

permissions:
  contents: write

concurrency:
  group: waiter-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/waiter
    env:
      VITE_API_URL: ${{ inputs.api_url || vars.SEER_API_URL || 'https://eirsha-api.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install
        run: |
          npm install
          # one command: a later "npm install" would remove packages that are not in package.json
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets

      - name: Build the web app
        run: npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon and splash screen
        continue-on-error: true
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#141415' --iconBackgroundColorDark '#141415' \
            --splashBackgroundColor '#141415' --splashBackgroundColorDark '#141415'

      - name: Version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build the APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SEER-Waiter.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SEER-Waiter-apk
          path: SEER-Waiter.apk

      - name: Publish the download
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete waiter-android --yes --cleanup-tag || true
          gh release create waiter-android SEER-Waiter.apk \
            --title "SEER Waiter for Android (build ${{ github.run_number }})" \
            --notes "Install: open this page on the phone, download SEER-Waiter.apk and open it. Android will ask to allow installing from this source. If an older build is installed, remove it first. Server: ${{ env.VITE_API_URL }}"
